name: Prepare signed updater artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: vars.UPDATER_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.ref_protected
    environment: updater-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run verify:gates
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - name: Sign exact verified checkout
        run: node scripts/publish-updater-release.js
        env:
          UPDATER_SIGNING_KEY_PEM: ${{ secrets.UPDATER_SIGNING_KEY_PEM }}
          UPDATER_RELEASE_OUTPUT: ${{ runner.temp }}/orchestrator-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-${{ github.sha }}
          path: ${{ runner.temp }}/orchestrator-release
          if-no-files-found: error
          retention-days: 14
